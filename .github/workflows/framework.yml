name: framework
# Deploys the Flight opt-in demo (a tiny Flight+Fizz framework Worker) for each variant in flight-versions.json
# as react-eco-fw-<variant>. /plain = framework does not use the new Flight APIs, /optin = it does.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Variant from flight-versions.json (blank = all)
        required: false
  push:
    branches: [main]
    paths: [demos/framework/**, scripts/build-framework.mjs, flight-versions.json, .github/workflows/framework.yml]
jobs:
  variants:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.l.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: |
          if [ -n "${{ inputs.variant }}" ]; then echo 'list=["${{ inputs.variant }}"]' >> $GITHUB_OUTPUT
          else echo "list=$(jq -c 'keys' flight-versions.json)" >> $GITHUB_OUTPUT; fi
  deploy:
    needs: variants
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.variants.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 11 }
      - run: node scripts/build-framework.mjs ${{ matrix.variant }}
      - name: Deploy to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: .build/framework-${{ matrix.variant }}
        run: npx wrangler deploy
