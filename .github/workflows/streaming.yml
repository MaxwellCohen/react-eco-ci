name: streaming
# Builds each variant in versions.json (repo + ref + forced flags) and deploys it as its own
# Cloudflare Worker, react-eco-stream-<variant>, so the streamed HTML can be compared live.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Variant from versions.json (blank = all)
        required: false
  push:
    branches: [main]
    paths: [versions.json, demos/streaming/**, scripts/build-stream.mjs, .github/workflows/streaming.yml]
jobs:
  variants:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.l.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: |
          if [ -n "${{ inputs.variant }}" ]; then echo 'list=["${{ inputs.variant }}"]' >> $GITHUB_OUTPUT
          else echo "list=$(jq -c 'keys' versions.json)" >> $GITHUB_OUTPUT; fi
  deploy:
    needs: variants
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.variants.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 11 }
      - run: node scripts/build-stream.mjs ${{ matrix.variant }}
      - name: Deploy to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: .build/streaming-${{ matrix.variant }}
        run: npx wrangler deploy
