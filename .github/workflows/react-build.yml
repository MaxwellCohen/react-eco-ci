name: react-build
# Builds React at any commit from any repo, publishes it to pkg.pr.new (from THIS repo),
# then builds + deploys the Vite/Next/Waku demos against it.
# Install the GitHub App on this repo first: https://github.com/apps/pkg-pr-new
on:
  workflow_dispatch:
    inputs:
      repo:
        description: React repo (owner/name)
        default: facebook/react
      ref:
        description: Commit SHA, branch or tag
        required: true
      channel:
        description: Release channel
        default: experimental
        type: choice
        options: [experimental, stable]
      flags:
        description: Comma-separated ReactFeatureFlags to force true (e.g. enableFlightHostElision,enableFlightHtmlFirst)
        required: false
      suffix:
        description: Appended to the label (and Worker names) so flag variants of one commit do not collide
        required: false
      templates:
        description: JSON list of demo templates to build and deploy
        default: '["vite","next","waku","perf"]'
      reuse_run:
        description: Run id whose react-urls artifact to reuse instead of rebuilding React (pair with next_url)
        required: false
      next_url:
        description: Optional Next fork preview URL (pkg.pr.new .../next@<sha>) with vendored React
        required: false
      next_repo:
        description: Next.js fork to build with this React vendored (blank = skip; e.g. MaxwellCohen/next.js)
        required: false
      next_ref:
        description: Branch/ref of the Next.js fork
        default: canary

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      label: ${{ steps.meta.outputs.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          path: react-src
      - id: meta
        working-directory: react-src
        env:
          SUFFIX: ${{ inputs.suffix }}
        run: echo "label=$(git rev-parse --short=8 HEAD)${SUFFIX:+-$SUFFIX}" >> "$GITHUB_OUTPUT"
      - name: Force feature flags
        if: ${{ inputs.flags != '' }}
        env:
          FLAGS: ${{ inputs.flags }}
        run: |
          node scripts/force-flags.mjs react-src "$FLAGS"
          git -C react-src diff --stat
      - name: Reuse react-urls from an earlier run
        if: ${{ inputs.reuse_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ inputs.reuse_run }} -R ${{ github.repository }} -n react-urls
      - uses: actions/setup-node@v4
        if: ${{ inputs.reuse_run == '' }}
        with:
          node-version-file: react-src/.nvmrc
          cache: yarn
          cache-dependency-path: |
            react-src/yarn.lock
            react-src/compiler/yarn.lock
      - uses: actions/setup-java@v4
        if: ${{ inputs.reuse_run == '' }}
        with: { distribution: temurin, java-version: 11 }
      - run: yarn install --frozen-lockfile
        if: ${{ inputs.reuse_run == '' }}
        working-directory: react-src
      # The compiler is a separate yarn workspace; its @types are needed when
      # `yarn build` compiles eslint-plugin-react-hooks against compiler sources.
      - run: yarn install --frozen-lockfile
        if: ${{ inputs.reuse_run == '' }}
        working-directory: react-src/compiler
      - run: yarn build -r=${{ inputs.channel }}
        if: ${{ inputs.reuse_run == '' }}
        working-directory: react-src
      - name: Publish to pkg.pr.new
        if: ${{ inputs.reuse_run == '' }}
        run: node scripts/publish-react.mjs react-src/build/oss-${{ inputs.channel }}
      - uses: actions/upload-artifact@v4
        with:
          name: react-urls
          path: react-urls.json

  next-fork:
    needs: publish
    if: ${{ inputs.next_repo != '' && inputs.reuse_run == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      url: ${{ steps.pub.outputs.url }}
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_SKIP_NATIVE_POSTINSTALL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.next_repo }}
          ref: ${{ inputs.next_ref }}
          path: next-src
      - uses: actions/download-artifact@v4
        with: { name: react-urls }
      - uses: actions/setup-node@v4
        with:
          node-version-file: next-src/.node-version
          package-manager-cache: false
      - run: |
          npm i -g corepack@0.31
          corepack enable
      - name: Point Next's vendored React at this build
        run: node scripts/patch-next-react.mjs next-src react-urls.json
      - run: pnpm install --no-frozen-lockfile
        working-directory: next-src
      - name: Vendor React
        run: pnpm ncc-compiled
        working-directory: next-src/packages/next
      - name: Build Next.js
        run: pnpm build --filter=next
        working-directory: next-src
      - name: Publish next to pkg.pr.new
        id: pub
        run: |
          npx --yes pkg-pr-new@latest publish --pnpm --no-compact --no-template --comment=off --json next-output.json ./next-src/packages/next
          echo "url=$(jq -r '.packages[] | select(.name=="next") | .url' next-output.json)" >> "$GITHUB_OUTPUT"

  demos:
    needs: [publish, next-fork]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      # Job-level so the deploy step's `if` can see it (secrets are not allowed in `if`).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJson(inputs.templates) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: react-urls }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Add Next fork URL
        if: ${{ inputs.next_url != '' || needs.next-fork.outputs.url != '' }}
        env:
          NEXT_URL: ${{ needs.next-fork.outputs.url || inputs.next_url }}
        run: |
          jq --arg u "$NEXT_URL" '. + {next: $u}' react-urls.json > tmp.json
          mv tmp.json react-urls.json
      - run: node scripts/build-variant.mjs ${{ matrix.template }} ${{ needs.publish.outputs.label }}
      - name: Deploy to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: .build/${{ matrix.template }}-${{ needs.publish.outputs.label }}
        run: npm run deploy
